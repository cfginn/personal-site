<!DOCTYPE html>

<head>

<title>Caleb Ginn</title>
<link rel="stylesheet" href="theme.css">
<style>
  .home {
    min-height: calc(100vh - 100px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 22px;
  }
  .home h1 { font-size: 34px; font-weight: 640; letter-spacing: -0.02em; margin: 0; }

</style>
</head>
<body>
<div class="wrap">

  <header class="top" style="display:flex; justify-content:flex-end;">
    <button class="theme-btn" id="themeBtn" type="button">Dark</button>
  </header>

  <main class="home">
    <h1>Hi, I'm Caleb.</h1>
    <p class="sub">This is my website</p>
    <a class="btn" href="hotel-split.html">Hotel split calculator</a>

<script src="theme.js" defer></script>

</html>
